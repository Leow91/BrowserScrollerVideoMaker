version: '3.8'

services:
  scroll-video-gen:
    build: .
    container_name: scroll-video-generator
    ports:
      - "${GUI_PORT:-7860}:7860"
    volumes:
      # Persist workflows
      - ./workflows:/app/workflows
      # Persist output videos
      - ./output:/app/output
      # Persist logs
      - ./logs:/app/logs
      # Optional: custom configuration
      - ./.env:/app/.env:ro
    environment:
      # Override config via environment variables
      - GUI_HOST=0.0.0.0
      - GUI_PORT=7860
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - MAX_CONCURRENT_JOBS=${MAX_CONCURRENT_JOBS:-3}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:7860', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    # Resource limits (adjust based on your needs)
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 4G
        reservations:
          cpus: '2.0'
          memory: 2G
